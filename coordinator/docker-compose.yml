services:
  etherlighting-coordinator:
    build: .
    container_name: etherlighting-coordinator
    restart: unless-stopped
    network_mode: host
    volumes:
      - /root/.ssh:/root/.ssh:ro
      - ./switches.json:/app/switches.json:ro
    environment:
      - TZ=${TZ:-America/Chicago}
    healthcheck:
      # python:3.13-slim has no curl; the check uses the interpreter the image already has.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9199/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
